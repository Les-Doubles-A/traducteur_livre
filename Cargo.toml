[package]
name = "traducteur_livre"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
eframe = { version = "0.37.0", features = ["persistence"] }
ego-tree = "0.11"
encoding_rs = "0.8.44"
genpdf = "0.2.0"
pdf-extract = "0.12.1"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
rfd = "0.17.2"
roxmltree = "0.21.2"
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true

[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
winresource = "0.1.34"

